<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Tableau de Bord Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-card: rgba(17, 17, 24, 0.75);
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.16);
            --text: #e8e8ef;
            --text-sec: #9b9ba8;
            --text-muted: #5e5e74;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --gradient: linear-gradient(135deg, #6c5ce7, #00cec9);
            --danger: #fd79a8;
            --danger-bg: rgba(253, 121, 168, 0.12);
            --success: #00b894;
            --radius: 14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108,92,231,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0,206,201,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ================= AUTHENTICATION OVERLAY ================= */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .auth-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(108, 92, 231, 0.15);
            text-align: center;
            position: relative;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .auth-icon-wrap {
            width: 68px;
            height: 68px;
            background: var(--gradient);
            border-radius: 18px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: var(--text-sec);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .auth-input-group {
            position: relative;
            text-align: left;
        }

        .auth-input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-sec);
            margin-bottom: 8px;
        }

        .auth-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-wrapper i.prefix-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .auth-input {
            width: 100%;
            padding: 14px 44px 14px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.25);
        }

        .auth-input:focus + .prefix-icon {
            color: var(--accent);
        }

        .auth-toggle-pwd {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .auth-toggle-pwd:hover {
            color: var(--text);
        }

        .auth-error {
            display: none;
            padding: 12px 16px;
            background: var(--danger-bg);
            border: 1px solid rgba(253, 121, 168, 0.3);
            border-radius: 8px;
            color: #ff94ba;
            font-size: 0.82rem;
            font-weight: 500;
            text-align: left;
            align-items: center;
            gap: 10px;
        }

        .auth-error.visible {
            display: flex;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .auth-submit-btn {
            padding: 14px 24px;
            background: var(--gradient);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35);
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
        }

        .auth-submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-back-link {
            margin-top: 22px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
        }

        .auth-back-link:hover {
            color: var(--text);
        }

        /* ================= ADMIN DASHBOARD LAYOUT ================= */
        .admin-app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,15,0.85);
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-brand-icon {
            width: 38px;
            height: 38px;
            background: var(--gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }

        .admin-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-action {
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            color: var(--text-sec);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-action:hover {
            border-color: var(--border-hover);
            color: var(--text);
            background: rgba(255,255,255,0.06);
        }

        .btn-primary-action {
            background: var(--gradient);
            border: none;
            color: #fff;
            box-shadow: 0 4px 14px rgba(108,92,231,0.25);
        }

        .btn-primary-action:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108,92,231,0.4);
        }

        .btn-logout {
            border-color: rgba(253, 121, 168, 0.25);
            color: var(--danger);
        }

        .btn-logout:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #fff;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 24px 40px;
        }

        .stat-card {
            flex: 1;
            padding: 22px 26px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            flex-shrink: 0;
        }

        .stat-icon.unread {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            box-shadow: 0 6px 18px rgba(253, 121, 168, 0.3);
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.76rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            margin-top: 4px;
        }

        .messages-container {
            padding: 0 40px 40px;
            flex: 1;
        }

        .messages-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-sec);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .message-card {
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 14px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--gradient);
            opacity: 0;
            transition: 0.3s;
        }

        .message-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .message-card:hover::before {
            opacity: 1;
        }

        .message-card.unread {
            border-left: 4px solid var(--accent);
            background: rgba(22, 22, 34, 0.85);
        }

        .message-card.unread::before {
            opacity: 1;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 16px;
        }

        .msg-sender {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .msg-avatar {
            width: 44px;
            height: 44px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .msg-name {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-email {
            font-size: 0.82rem;
            color: var(--accent2);
            margin-top: 2px;
        }

        .msg-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-body {
            font-size: 0.92rem;
            color: var(--text-sec);
            line-height: 1.7;
            padding: 16px 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .msg-btn {
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: var(--text-sec);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
        }

        .msg-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: rgba(108,92,231,0.1);
        }

        .msg-btn.mark-read:hover {
            border-color: var(--success);
            color: var(--success);
            background: rgba(0, 184, 148, 0.1);
        }

        .msg-btn.delete:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-bg);
        }

        .unread-badge {
            background: var(--danger);
            color: #fff;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3.2rem;
            margin-bottom: 16px;
            display: block;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: var(--text-sec);
            max-width: 400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .admin-header { padding: 16px 20px; flex-direction: column; gap: 14px; align-items: stretch; }
            .header-actions { justify-content: space-between; flex-wrap: wrap; }
            .stats-bar { flex-direction: column; padding: 16px 20px; }
            .messages-container { padding: 0 20px 20px; }
            .auth-card { padding: 32px 24px; }
            .msg-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- ================= AUTHENTICATION OVERLAY ================= -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <div class="auth-icon-wrap">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="auth-title">Accès Administrateur</h2>
            <p class="auth-subtitle">Veuillez vous authentifier pour accéder à la boîte de réception des messages</p>

            <form id="authForm" class="auth-form" onsubmit="handleLogin(event)">
                <div class="auth-input-group">
                    <label for="adminPassword">Mot de passe secret</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock prefix-icon"></i>
                        <input type="password" id="adminPassword" class="auth-input" placeholder="Entrez le mot de passe admin" required autocomplete="current-password" autofocus>
                        <button type="button" class="auth-toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Afficher le mot de passe">
                            <i id="togglePwdIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="authError" class="auth-error" role="alert">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="authErrorText">Mot de passe incorrect</span>
                </div>

                <button type="submit" id="authSubmitBtn" class="auth-submit-btn">
                    <span id="authBtnText">Se connecter</span>
                    <i id="authBtnIcon" class="fas fa-arrow-right"></i>
                </button>
            </form>

            <a href="https://soufianemajd.github.io/Portfolio/" class="auth-back-link">
                <i class="fas fa-arrow-left"></i> Retour au Portfolio
            </a>
        </div>
    </div>

    <!-- ================= ADMIN DASHBOARD ================= -->
    <div id="adminApp" class="admin-app" style="display: none;">
        <header class="admin-header">
            <div class="admin-brand">
                <div class="admin-brand-icon"><i class="fas fa-inbox"></i></div>
                <h1>Tableau de Bord Messages</h1>
            </div>
            <div class="header-actions">
                <button class="btn-action btn-primary-action" onclick="loadMessages()">
                    <i class="fas fa-sync-alt"></i> Actualiser
                </button>
                <a href="https://soufianemajd.github.io/Portfolio/" class="btn-action">
                    <i class="fas fa-arrow-left"></i> Portfolio
                </a>
                <button class="btn-action btn-logout" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-envelope"></i></div>
                <div>
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Messages</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon unread"><i class="fas fa-bell"></i></div>
                <div>
                    <div class="stat-value" id="unreadCount">0</div>
                    <div class="stat-label">Non Lus</div>
                </div>
            </div>
        </div>

        <main class="messages-container">
            <div class="messages-title">
                <i class="fas fa-list-ul"></i> Tous les messages
            </div>
            <div id="messagesList"></div>
        </main>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // Détection automatique du backend (support de Live Server sur le port 5500 ou fichier local)
        const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const BACKEND_URL = (window.location.protocol === 'file:' || (isLocalHost && window.location.port !== '3000'))
            ? 'http://localhost:3000'
            : '';

        const API_MESSAGES = `${BACKEND_URL}/api/messages`;
        const API_LOGIN = `${BACKEND_URL}/api/admin/login`;
        const API_LOGOUT = `${BACKEND_URL}/api/admin/logout`;
        const API_VERIFY = `${BACKEND_URL}/api/admin/verify`;

        const TOKEN_KEY = 'portfolio_admin_token';

        function getToken() {
            return sessionStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            sessionStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            sessionStorage.removeItem(TOKEN_KEY);
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('adminPassword');
            const icon = document.getElementById('togglePwdIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showAuthError(msg) {
            const errDiv = document.getElementById('authError');
            const errText = document.getElementById('authErrorText');
            errText.textContent = msg || 'Mot de passe incorrect';
            errDiv.classList.add('visible');
        }

        function hideAuthError() {
            const errDiv = document.getElementById('authError');
            errDiv.classList.remove('visible');
        }

        function showDashboard() {
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('adminApp').style.display = 'flex';
        }

        function showAuthScreen(errorMsg = null) {
            clearToken();
            document.getElementById('adminApp').style.display = 'none';
            const overlay = document.getElementById('authOverlay');
            overlay.classList.remove('hidden');
            const pwdInput = document.getElementById('adminPassword');
            pwdInput.value = '';
            if (errorMsg) {
                showAuthError(errorMsg);
            } else {
                hideAuthError();
            }
            setTimeout(() => pwdInput.focus(), 150);
        }

        // Authenticated fetch wrapper
        async function authFetch(url, options = {}) {
            const token = getToken();
            const headers = Object.assign({}, options.headers || {}, {
                'Authorization': `Bearer ${token}`
            });

            const response = await fetch(url, Object.assign({}, options, { headers }));

            if (response.status === 401) {
                showAuthScreen('Votre session a expiré. Veuillez vous reconnecter.');
                throw new Error('Unauthorized');
            }

            return response;
        }

        // Login handler
        async function handleLogin(e) {
            e.preventDefault();
            hideAuthError();

            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('authSubmitBtn');
            const btnText = document.getElementById('authBtnText');
            const btnIcon = document.getElementById('authBtnIcon');

            btn.disabled = true;
            btnText.textContent = 'Vérification...';
            btnIcon.className = 'fas fa-spinner fa-spin';

            try {
                const res = await fetch(API_LOGIN, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok && data.success && data.token) {
                    setToken(data.token);
                    showDashboard();
                    loadMessages();
                } else {
                    showAuthError(data.error || 'Mot de passe invalide');
                    document.getElementById('adminPassword').focus();
                }
            } catch (err) {
                if (window.location.hostname.includes('github.io')) {
                    showAuthError('GitHub Pages est un hébergement statique sans backend. Pour consulter la base locale, lancez "npm start" et ouvrez http://localhost:3000/admin.html');
                } else {
                    showAuthError('Impossible de joindre le serveur. Assurez-vous que le serveur Node.js est démarré sur http://localhost:3000');
                }
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Se connecter';
                btnIcon.className = 'fas fa-arrow-right';
            }
        }

        // Logout handler
        async function handleLogout() {
            try {
                await authFetch(API_LOGOUT, { method: 'POST' });
            } catch (e) {
                // Ignore failure on logout
            }
            showAuthScreen();
        }

        // Load messages and stats
        async function loadMessages() {
            const container = document.getElementById('messagesList');
            try {
                const [msgsRes, statsRes] = await Promise.all([
                    authFetch(API_MESSAGES),
                    authFetch(API_MESSAGES + '/stats')
                ]);

                const msgsData = await msgsRes.json();
                const statsData = await statsRes.json();

                document.getElementById('totalCount').textContent = statsData.total || 0;
                document.getElementById('unreadCount').textContent = statsData.unread || 0;

                renderMessages(msgsData.messages || []);
            } catch (err) {
                if (err.message !== 'Unauthorized') {
                    console.error('Erreur de chargement des messages:', err);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Erreur de connexion</h3>
                            <p>Impossible de récupérer les messages depuis le serveur.</p>
                        </div>
                    `;
                }
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesList');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Aucun message pour le moment</h3>
                        <p>Les messages envoyés via le formulaire de contact apparaîtront ici.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const initials = (msg.name || 'Anonyme').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                const date = new Date(msg.created_at).toLocaleString('fr-FR', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                const unreadClass = msg.is_read ? '' : 'unread';

                return `
                    <div class="message-card ${unreadClass}" id="msg-${msg.id}">
                        <div class="msg-header">
                            <div class="msg-sender">
                                <div class="msg-avatar">${initials}</div>
                                <div>
                                    <div class="msg-name">
                                        ${escapeHtml(msg.name)} 
                                        ${!msg.is_read ? '<span class="unread-badge">NOUVEAU</span>' : ''}
                                    </div>
                                    <div class="msg-email">${escapeHtml(msg.email)}</div>
                                </div>
                            </div>
                            <div class="msg-date"><i class="far fa-clock"></i> ${date}</div>
                        </div>
                        <div class="msg-body">${escapeHtml(msg.message)}</div>
                        <div class="msg-actions">
                            ${!msg.is_read ? `<button class="msg-btn mark-read" onclick="markRead(${msg.id})"><i class="fas fa-check"></i> Marquer comme lu</button>` : ''}
                            <a href="mailto:${escapeHtml(msg.email)}?subject=Re: Contact Portfolio Soufiane Majd" class="msg-btn"><i class="fas fa-reply"></i> Répondre</a>
                            <button class="msg-btn delete" onclick="deleteMsg(${msg.id})"><i class="far fa-trash-alt"></i> Supprimer</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function markRead(id) {
            try {
                await authFetch(`${API_MESSAGES}/${id}/read`, { method: 'PATCH' });
                loadMessages();
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteMsg(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer définitivement ce message ?')) return;
            try {
                await authFetch(`${API_MESSAGES}/${id}`, { method: 'DELETE' });
                loadMessages();
            } catch (err) {
                console.error(err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Init: verify token or show auth screen
        async function init() {
            const token = getToken();
            if (!token) {
                showAuthScreen();
                return;
            }

            try {
                const res = await fetch(API_VERIFY, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showDashboard();
                    loadMessages();
                } else {
                    showAuthScreen();
                }
            } catch (err) {
                showAuthScreen();
            }
        }

        init();
    </script>
</body>
</html>
